<div xmlns:th="http://www.thymeleaf.org" th:replace="base">
    <div th:fragment="contenido" >
        <form>
            <div class="mb-3"
                th:each="item: ${datos}">
                <label class="form-label"
                    th:attr="for=${item}"
                    th:text="${item}">label</label>
                <input class="form-control"
                       th:attr="id=${item}" placeholder="Ingrese datos">
            </div>

            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
    </div>
</div>
